<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直击先进案例库</title>
<style>
:root{
  --primary:hsl(221,83%,58%);
  --accent:hsl(245,62%,62%);
  --background:hsl(224,44%,5%);
  --card:hsl(223,36%,11%);
  --foreground:hsl(213,35%,96%);
  --muted-foreground:hsl(216,20%,73%);
  --border:hsl(221,24%,22%);
  --success:hsl(148,58%,46%);
  --warning:hsl(34,90%,56%);
  --secondary:hsl(222,28%,15%);
  --muted:hsl(223,26%,15%);
  --elevate-1:rgba(255,255,255,0.04);
  --elevate-2:rgba(255,255,255,0.09);
  --button-outline:rgba(255,255,255,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Tahoma,"PingFang SC","Microsoft Yahei",Arial,"Hiragino Sans GB",sans-serif;
  background:var(--background);
  color:var(--foreground);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}

/* ===== 背景光晕 ===== */
.app-bg-glow{
  position:fixed;top:0;left:0;right:0;height:600px;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, hsla(221,83%,58%,0.12), transparent),
    radial-gradient(ellipse 60% 40% at 30% 0%, hsla(245,62%,62%,0.10), transparent),
    radial-gradient(ellipse 50% 30% at 70% -10%, hsla(221,83%,58%,0.08), transparent);
}

/* ===== 导航栏 ===== */
.navbar{
  position:sticky;top:0;z-index:50;width:100%;
  background:rgba(7,10,19,0.8);backdrop-filter:blur(12px);
  border-bottom:1px solid hsla(221,24%,22%,0.5);
}
.navbar-inner{
  max-width:1280px;margin:0 auto;padding:0 24px;height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--foreground);}
.logo-mark{
  width:32px;height:32px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,hsl(221,83%,58%),hsl(245,62%,62%));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{
  padding:8px 14px;border-radius:6px;font-size:14px;color:var(--muted-foreground);
  transition:all .15s;white-space:nowrap;
}
.nav-link:hover{color:var(--foreground);background:var(--elevate-1);}
.nav-link.active{color:#fff;background:hsla(221,83%,58%,0.15);}
.nav-toggle{display:none;width:40px;height:40px;border:none;background:transparent;color:var(--foreground);border-radius:8px;}
.nav-toggle:hover{background:var(--elevate-1);}
.nav-mobile{
  display:none;flex-direction:column;padding:8px 16px 16px;gap:2px;
  background:rgba(7,10,19,0.95);border-bottom:1px solid hsla(221,24%,22%,0.5);
}
.nav-mobile.open{display:flex;}
.nav-mobile .nav-link{padding:12px 14px;font-size:15px;}

/* ===== 容器 ===== */
.container{max-width:1280px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}

/* ===== 按钮 ===== */
.button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:6px;font-size:14px;font-weight:500;transition:all .15s;white-space:nowrap;
  border:1px solid transparent;min-height:36px;padding:0 16px;line-height:1;
}
.button-default{background:var(--primary);color:#fff;border-color:hsl(221,70%,48%);box-shadow:0 0 20px -5px hsla(221,83%,58%,0.3);}
.button-default:hover{background:hsl(221,83%,62%);}
.button-outline{background:transparent;color:var(--foreground);border-color:var(--button-outline);}
.button-outline:hover{background:var(--elevate-1);border-color:rgba(255,255,255,0.2);}
.button-secondary{background:var(--secondary);color:var(--foreground);border-color:var(--border);}
.button-secondary:hover{background:hsl(222,28%,19%);}
.button-ghost{background:transparent;color:var(--foreground);}
.button-ghost:hover{background:var(--elevate-1);}
.button-lg{min-height:40px;padding:0 32px;}
.button-sm{min-height:32px;padding:0 12px;font-size:12px;}
.button[disabled]{opacity:.5;cursor:not-allowed;}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0/.25);}
.biz-card{
  background:var(--card);border:1px solid hsla(221,24%,22%,0.6);border-radius:8px;
  transition:all .2s ease;overflow:hidden;display:flex;flex-direction:column;
}
.biz-card:hover{
  border-color:hsla(221,83%,58%,0.4);
  box-shadow:inset 0 0 0 9999px var(--elevate-1);
}
.featured-card{box-shadow:0 0 20px -5px hsla(221,83%,58%,0.3);border-color:hsla(221,83%,58%,0.35);}

/* ===== Hero ===== */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:72px 0 48px;}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--muted-foreground);margin-bottom:20px;
}
.hero-eyebrow::before{content:"";width:20px;height:2px;background:var(--primary);border-radius:1px;}
.hero-title{
  font-size:48px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;
  background:linear-gradient(135deg,#ffffff 0%,#93c5fd 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
.hero-subtitle{font-size:18px;color:var(--muted-foreground);line-height:1.7;margin-top:16px;max-width:500px;}
.hero-actions{display:flex;align-items:center;gap:16px;margin-top:28px;flex-wrap:wrap;}
.hero-note{font-size:12px;color:var(--muted-foreground);margin-top:10px;}

/* AI 轨道 */
.orbit-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:420px;margin:0 auto;}
.orbit-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px dashed hsla(221,83%,58%,0.35);
}
.orbit-ring-inner{inset:18%;border-color:hsla(245,62%,62%,0.3);}
.orbit-flow{
  position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, hsla(221,83%,58%,0.6) 60deg, hsla(245,62%,62%,0.4) 120deg, transparent 180deg);
  -webkit-mask:radial-gradient(circle, transparent calc(50% - 1.5px), black calc(50% - 1.5px));
  mask:radial-gradient(circle, transparent calc(50% - 1.5px), black calc(50% - 1.5px));
  animation:orbit-spin 16s linear infinite;
}
.orbit-flow-inner{inset:18%;animation:orbit-spin 11s linear infinite reverse;}
@keyframes orbit-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.orbit-core{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:76px;height:76px;border-radius:14px;
  background:linear-gradient(135deg,#f5e680,#80d8a0);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;color:#16312a;letter-spacing:.05em;
  animation:ai-breathe 3.2s ease-in-out infinite;
}
@keyframes ai-breathe{
  0%,100%{box-shadow:0 0 20px 2px hsla(221,83%,58%,0.5),0 0 40px 4px hsla(245,62%,62%,0.3);}
  50%{box-shadow:0 0 30px 6px hsla(221,83%,58%,0.7),0 0 60px 10px hsla(245,62%,62%,0.5);}
}
.orbit-card{
  position:absolute;padding:8px 14px;border-radius:10px;background:var(--card);
  border:1px solid var(--border);font-size:13px;font-weight:500;white-space:nowrap;
  box-shadow:0 2px 8px rgb(0 0 0/.3);transition:all .2s;
}
.orbit-card:hover{transform:scale(1.1);box-shadow:0 0 18px -4px hsla(221,83%,58%,0.55);}
.orbit-card b{color:#93c5fd;font-weight:700;}
.oc-1{top:6%;left:50%;transform:translateX(-50%);}
.oc-2{right:0;top:50%;transform:translateY(-50%);}
.oc-3{bottom:6%;left:50%;transform:translateX(-50%);}
.oc-4{left:0;top:26%;}
.oc-5{left:2%;bottom:20%;}
.oc-1:hover,.oc-3:hover{transform:translateX(-50%) scale(1.1);}

/* ===== StatsBanner ===== */
.stats-banner{
  border:1px solid var(--border);border-radius:12px;background:var(--card);
  padding:20px 24px;margin:16px 0 48px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
}
.stat-item{display:inline-flex;align-items:baseline;gap:8px;}
.stat-num{font-size:24px;font-weight:700;color:var(--foreground);}
.stat-label{font-size:14px;color:var(--muted-foreground);}
.stat-sep{color:var(--border);font-size:18px;}

/* ===== Section ===== */
.section{padding:24px 0 56px;}
.section-head{margin-bottom:24px;}
.section-eyebrow{font-size:14px;color:var(--muted-foreground);margin-bottom:8px;}
.section-title{font-size:30px;font-weight:600;letter-spacing:-0.01em;}
.section-sub{font-size:15px;color:var(--muted-foreground);margin-top:8px;}

/* ===== 胶囊筛选 ===== */
.pill-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;}
.pill-row::-webkit-scrollbar{display:none;}
.pill{
  flex:none;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;
  background:var(--card);color:var(--foreground);border:1px solid transparent;transition:all .15s;
}
.pill:hover{border-color:hsla(221,83%,58%,0.4);}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ===== 网格 ===== */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}

/* ===== LiveCard ===== */
.live-card{cursor:pointer;}
.live-card-cover{position:relative;aspect-ratio:16/9;background:var(--muted);overflow:hidden;}
.live-card-cover img{width:100%;height:100%;object-fit:cover;}
.cover-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);font-size:13px;}
.status-badge{
  position:absolute;top:10px;left:10px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;
}
.status-done{background:hsla(148,58%,46%,0.15);color:hsl(148,58%,65%);border:1px solid hsla(148,58%,46%,0.4);}
.status-upcoming{background:hsla(34,90%,56%,0.15);color:hsl(34,90%,70%);border:1px solid hsla(34,90%,56%,0.4);}
.live-card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;}
.tag{
  font-size:11px;padding:2px 10px;border-radius:999px;border:1px solid hsla(221,83%,58%,0.4);
  color:hsl(221,83%,75%);background:hsla(221,83%,58%,0.08);
}
.tag-role{
  border-color:hsla(245,62%,62%,0.4);color:hsl(245,62%,78%);background:hsla(245,62%,62%,0.1);
}
.card-title{font-size:18px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{font-size:13px;color:var(--muted-foreground);}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px;}
.useful-btn{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);
  background:transparent;border:none;padding:4px 8px;border-radius:6px;transition:all .15s;
}
.useful-btn:hover{background:var(--elevate-1);color:var(--foreground);}
.useful-btn.liked{color:hsl(221,83%,70%);}

/* ===== GuestCard ===== */
.guest-card{padding:20px;}
.guest-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.avatar{
  width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;
  background:linear-gradient(135deg,hsl(221,83%,58%),hsl(245,62%,62%));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:18px;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.guest-name{font-size:16px;font-weight:600;line-height:1.35;}
.guest-company{font-size:13px;color:var(--muted-foreground);margin-top:2px;}
.guest-topic{font-size:14px;color:var(--muted-foreground);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px;}
.guest-foot{display:flex;align-items:center;justify-content:space-between;}

/* 岗位标签色 */
.role-tag{font-size:11px;padding:2px 10px;border-radius:999px;font-weight:500;}
.role-0{border:1px solid rgba(96,165,250,.3);background:rgba(96,165,250,.1);color:rgb(147,197,253);}
.role-1{border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.1);color:rgb(103,232,249);}
.role-2{border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.1);color:rgb(110,231,183);}
.role-3{border:1px solid rgba(244,114,182,.3);background:rgba(244,114,182,.1);color:rgb(249,168,212);}
.role-4{border:1px solid rgba(167,139,250,.3);background:rgba(167,139,250,.1);color:rgb(196,181,253);}
.role-5{border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.1);color:rgb(252,211,77);}
.role-6{border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.1);color:rgb(253,164,175);}

/* ===== 素材页 ===== */
.filter-bar{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.search-box{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:0 14px;height:42px;transition:border-color .15s;
}
.search-box:focus-within{border-color:hsla(221,83%,58%,0.5);}
.search-box svg{flex:none;color:var(--muted-foreground);}
.search-box input{
  flex:1;background:transparent;border:none;outline:none;color:var(--foreground);font-size:14px;font-family:inherit;
}
.search-box input::placeholder{color:var(--muted-foreground);}
.select-row{display:flex;gap:8px;flex-wrap:wrap;}
.select{
  background:var(--card);border:1px solid var(--border);color:var(--foreground);
  border-radius:8px;font-size:13px;padding:8px 12px;font-family:inherit;cursor:pointer;outline:none;
}
.select:hover{border-color:hsla(221,83%,58%,0.4);}
.result-count{font-size:14px;color:var(--muted-foreground);margin-bottom:14px;}
.material-list{display:flex;flex-direction:column;gap:16px;}
.material-card{
  display:flex;align-items:center;gap:16px;padding:14px;cursor:pointer;
  background:var(--card);border:1px solid hsla(221,24%,22%,0.6);border-radius:8px;transition:all .2s;
}
.material-card:hover{border-color:hsla(221,83%,58%,0.4);box-shadow:inset 0 0 0 9999px var(--elevate-1);}
.material-thumb{width:120px;height:68px;flex:none;border-radius:6px;overflow:hidden;background:var(--muted);position:relative;}
.material-thumb img{width:100%;height:100%;object-fit:cover;}
.material-thumb .cover-empty{font-size:11px;}
.material-info{flex:1;min-width:0;}
.material-title{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.material-meta{font-size:12px;color:var(--muted-foreground);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.issue-badge{font-size:11px;padding:2px 8px;border-radius:4px;background:hsla(221,83%,58%,0.15);color:hsl(221,83%,75%);}
.material-right{display:flex;align-items:center;gap:10px;flex:none;}
.material-arrow{color:var(--muted-foreground);}

/* ===== 播客 ===== */
.podcast-list{display:flex;flex-direction:column;gap:16px;}
.podcast-card{padding:20px;}
.podcast-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.podcast-title{font-size:18px;font-weight:600;}
.podcast-audio{margin-bottom:10px;}
.podcast-audio:last-child{margin-bottom:0;}
.audio-name{font-size:12px;color:var(--muted-foreground);margin-bottom:6px;}
.podcast-audio audio{width:100%;height:36px;}

/* ===== 详情页 ===== */
.detail-wrap{max-width:800px;margin:0 auto;padding:24px 0 64px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--muted-foreground);font-size:14px;padding:8px 12px;border-radius:6px;margin-bottom:20px;}
.back-btn:hover{background:var(--elevate-1);color:var(--foreground);}
.detail-main{display:grid;grid-template-columns:2fr 3fr;gap:24px;}
.detail-cover{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--muted);position:relative;}
.detail-cover img{width:100%;height:100%;object-fit:cover;}
.detail-info{display:flex;flex-direction:column;gap:10px;}
.detail-issue{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;background:hsla(221,83%,58%,0.15);color:hsl(221,83%,75%);}
.detail-title{font-size:24px;font-weight:600;line-height:1.35;}
.detail-row{display:flex;gap:8px;font-size:14px;}
.detail-row .k{color:var(--muted-foreground);flex:none;width:56px;}
.detail-row .v{color:var(--foreground);}
.detail-highlights{margin-top:24px;}
.detail-highlights h3{font-size:16px;font-weight:600;margin-bottom:10px;}
.detail-highlights p{font-size:14px;color:var(--muted-foreground);white-space:pre-wrap;line-height:1.8;}
.detail-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}

/* ===== 报名页 / 说明书 ===== */
.plain-wrap{max-width:800px;margin:0 auto;padding:48px 0 80px;text-align:center;}
.plain-title{font-size:30px;font-weight:600;margin-bottom:12px;}
.plain-sub{font-size:15px;color:var(--muted-foreground);margin-bottom:28px;}

/* ===== Tab ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{
  padding:10px 18px;font-size:14px;font-weight:500;background:transparent;border:none;color:var(--muted-foreground);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;
}
.tab:hover{color:var(--foreground);}
.tab.active{color:var(--foreground);border-bottom-color:var(--primary);}

/* ===== 弹窗 ===== */
.dialog-mask{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:none;
  align-items:center;justify-content:center;padding:24px;
}
.dialog-mask.open{display:flex;}
.dialog{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:360px;width:100%;
  position:relative;text-align:center;
}
.dialog-close{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--muted-foreground);padding:6px;border-radius:6px;}
.dialog-close:hover{background:var(--elevate-1);color:var(--foreground);}
.dialog h3{font-size:17px;font-weight:600;margin-bottom:18px;}
.dialog-qr{width:200px;height:200px;margin:0 auto;border-radius:10px;overflow:hidden;background:var(--muted);display:flex;align-items:center;justify-content:center;}
.dialog-qr img{width:100%;height:100%;object-fit:contain;}
.dialog-note{font-size:12px;color:var(--muted-foreground);margin-top:14px;}

/* ===== 空态/加载 ===== */
.state-empty{padding:48px 0;text-align:center;color:var(--muted-foreground);font-size:14px;}
.skeleton{background:var(--muted);border-radius:8px;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.skel-card{aspect-ratio:16/9;border-radius:8px;}

/* ===== Footer ===== */
.footer{border-top:1px solid var(--border);padding:32px 0;margin-top:48px;}
.footer-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted-foreground);}
.footer-note{max-width:1280px;margin:12px auto 0;padding:8px 24px 0;text-align:center;font-size:12px;color:var(--warning);opacity:.9;border-top:1px dashed var(--border);line-height:1.6;}

/* ===== 关于区块 ===== */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.value-col{display:flex;flex-direction:column;gap:14px;}
.value-item{display:flex;gap:10px;}
.value-item .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:8px;flex:none;}
.value-item h4{font-size:14px;font-weight:600;margin-bottom:2px;}
.value-item p{font-size:13px;color:var(--muted-foreground);line-height:1.6;}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;}
.step-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;}

/* ---------- 工具函数 ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(ms){
  if(!ms) return '待定';
  var d = new Date(ms);
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function shortDate(ms){
  if(!ms) return '';
  var d = new Date(ms);
  return (d.getMonth()+1) + '/' + d.getDate();
}
function tagHtml(text, cls){
  return '<span class="tag ' + (cls||'') + '">' + esc(text) + '</span>';
}
function firstChar(name){
  if(!name) return '?';
  var s = name.trim();
  return s.charAt(0);
}
function imgOrPlaceholder(url, cls, text){
  if(url){
    return '<img src="' + esc(url) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;cover-empty&quot;>' + esc(text) + '</div>\'">';
  }
  return '<div class="cover-empty">' + esc(text) + '</div>';
}

  saveLikes();

}

function materialFiltered(){
  var q = state.materialQuery.trim().toLowerCase();

  return RAW.lives.filter(function(l){
    if(q){
      var hit = false;
      if((l.topic||'').toLowerCase().indexOf(q) >= 0) hit = true;
      if((l.issue||'').toLowerCase().indexOf(q) >= 0) hit = true;
      (l.companies||[]).forEach(function(c){ if(c.toLowerCase().indexOf(q) >= 0) hit = true; });
      if(!hit) return false;
    }
    if(f.company !== '全部企业' && (l.companies||[]).indexOf(f.company) < 0) return false;
    if(f.industry !== '全部行业' && (l.industries||[]).indexOf(f.industry) < 0) return false;
    if(f.form !== '全部形式' && l.form !== f.form) return false;
    if(f.replay === '已有回放' && !l.replayLink) return false;
    if(f.replay === '暂无回放' && l.replayLink) return false;
    if(f.gift === '已有大礼包' && !l.giftLink) return false;
    if(f.gift === '暂无大礼包' && l.giftLink) return false;
    return true;
  });
}

      if(l.giftLink){ h += '<span class="tag" style="color:hsl(221,83%,75%);">有大礼包</span>'; }
      h += '<span class="material-arrow">' + ICON.chevronRight + '</span>';
      h += '</div></div>';
    });
    h += '</div>';
  }
  h += '</section>';
  app.innerHTML = h;
}

function selOpts(k, arr){
  var v = state.materialFilters[k];
  return arr.map(function(o){
    return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>';
  }).join('');
}

/* ---------- 直播详情 ---------- */
function renderLiveDetail(id){
  var l = null;
  for(var i=0;i<RAW.lives.length;i++){ if(RAW.lives[i].id === id){ l = RAW.lives[i]; break; } }
  if(!l){
    app.innerHTML = '<div class="plain-wrap"><div class="plain-title">未找到该直播</div><a class="button button-outline" href="#/pioneer">返回先锋实录</a></div>';
    return;
  }
  var cover = assetUrl(l.coverAsset);
  var isDone = l.status === '已完成';
  var isUpcoming = l.status === '预约中' || l.status === '进行中';
  var statusCls = isDone ? 'status-done' : 'status-upcoming';
  var h = '<div class="detail-wrap">';
  h += '<button class="back-btn" onclick="history.back()">' + ICON.chevronLeft + '返回</button>';
  h += '<div class="detail-main">';
  h += '<div class="detail-cover">' + imgOrPlaceholder(cover, '', '暂无封面') + '</div>';
  h += '<div class="detail-info">';
  if(l.issue){ h += '<span class="detail-issue">第' + esc(l.issue) + '期</span>'; }
  h += '<h1 class="detail-title">' + esc(l.topic || '未命名直播') + '</h1>';
  h += '<div class="detail-row"><span class="k">企业</span><span class="v">' + esc((l.companies||[]).join('、') || '—') + '</span></div>';
  h += '<div class="detail-row"><span class="k">嘉宾</span><span class="v">' + esc(l.speaker || '—') + '</span></div>';
  h += '<div class="detail-row"><span class="k">日期</span><span class="v">' + fmtDate(l.date) + '</span></div>';
  h += '<div class="detail-row"><span class="k">形式</span><span class="v">' + esc(l.form || '—') + '</span></div>';
  h += '<div class="detail-row"><span class="k">状态</span><span class="v"><span class="status-badge ' + statusCls + '" style="position:static">' + esc(l.status || '—') + '</span></span></div>';
  if(l.industries && l.industries.length){
    h += '<div class="detail-row"><span class="k">行业</span><span class="v"><span class="tag-row">' + l.industries.map(function(t){ return tagHtml(t); }).join('') + '</span></span></div>';
  }
  h += '</div></div>';

  if(l.highlights){
    h += '<div class="detail-highlights"><h3>直播看点</h3><p>' + esc(l.highlights) + '</p></div>';
  }

  if((isDone && l.replayLink) || (isUpcoming && (l.inviteLink || l.replayLink)) || l.giftLink){
    h += '<div class="detail-actions">';
    if(isDone && l.replayLink){
      h += '<a class="button button-default button-lg" href="' + esc(l.replayLink) + '" target="_blank" rel="noopener">查看回放</a>';
    } else if(isUpcoming && (l.inviteLink || l.replayLink)){
      h += '<a class="button button-default button-lg" href="' + esc(l.inviteLink || l.replayLink) + '" target="_blank" rel="noopener">预约直播</a>';
    }
    if(l.giftLink){
      h += '<a class="button button-outline button-lg" href="' + esc(l.giftLink) + '" target="_blank" rel="noopener">直播大礼包</a>';
    }
    h += '</div>';
  }
  h += '</div>';
  app.innerHTML = h;
}

/* ---------- 404 ---------- */
function renderNotFound(){
  app.innerHTML = '<div class="plain-wrap"><div class="plain-title">页面不存在</div><a class="button button-outline" href="#/home">返回首页</a></div>';
}

/* ---------- 路由 ---------- */
function parseHash(){
  var raw = location.hash || '#/home';
  var path = raw.replace(/^#\/?/, '');
  var parts = path.split('?');
  var seg = parts[0].split('/').filter(Boolean);
  var route = seg.length ? seg[0] : 'home';
  var params = {};
  if(seg[1]) params.id = seg[1];
  if(parts[1]){
    parts[1].split('&').forEach(function(kv){
      var p = kv.split('=');
      if(p[0]) params[p[0]] = decodeURIComponent(p[1] || '');
    });
  }
  return { route: route, params: params };
}

function router(){
  var r = parseHash();
  state.route = r.route;
  state.params = r.params;
  renderNav();
  if(r.params.id && (r.route === 'live')){ renderLiveDetail(r.params.id); return; }
  switch(r.route){
    case 'home': case '': renderHome(); break;
    case 'pioneer': renderPioneer(); break;
    case 'industry': renderIndustry(); break;
    case 'material': renderMaterial(); break;
    case 'register': renderRegister(); break;
    default: renderNotFound();
  }
  window.scrollTo(0,0);
}

/* ---------- 全局交互 ---------- */
function toggleLikeUI(btn){
  var key = btn.getAttribute('data-like-key');
  var rec = toggleLike(key);
  btn.classList.toggle('liked', rec.liked);
  btn.querySelector('span').textContent = rec.count;
}
function setTab(t){
  state.pioneerTab = t;
  if(t === 'role') state.roleFilter = '全部岗位'; else state.industryFilter = '全部行业';
  renderPioneer();
}
function setIndustry(v){ state.industryFilter = v; if(state.route === 'pioneer') renderPioneer(); else renderIndustry(); }
function setRole(v){ state.roleFilter = v; renderPioneer(); }
function setQuery(v){ state.materialQuery = v; renderMaterial(); var el = document.getElementById('materialQuery'); if(el) el.focus(); }
function setFilter(k, v){ state.materialFilters[k] = v; renderMaterial(); }

function openDialog(){
  document.getElementById('dialogMask').classList.add('open');
  var img = document.getElementById('dialogQrImg');
  img.src = ASSETS['qrcode'] || 'about:blank';
  document.getElementById('dialogNote').textContent = '扫码加入直击先进社群';
}
function closeDialog(){ document.getElementById('dialogMask').classList.remove('open'); }
document.getElementById('dialogClose').addEventListener('click', closeDialog);
document.getElementById('dialogMask').addEventListener('click', function(e){ if(e.target === this) closeDialog(); });

/* 汉堡菜单 */
document.getElementById('navToggle').addEventListener('click', function(){
  document.getElementById('navMobile').classList.toggle('open');
});

/* ---------- 启动 ---------- */
window.addEventListener('hashchange', function(){
  document.getElementById('navMobile').classList.remove('open');
  router();
});
router();

/* IIFE 内函数全局不可见，内联 onclick 依赖全局；此处显式暴露 */
window.setTab = setTab;
window.setIndustry = setIndustry;
window.setRole = setRole;
window.toggleLikeUI = toggleLikeUI;

})();
</script>
